[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "findmewho"
version = "1.0.0"
description = "High-speed passive B2B lead enrichment & OSINT engine (SpiderFoot distilled)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Manish Paneru" }
]
dependencies = [
    "requests>=2.28.0",
    "dnspython>=2.3.0",
    "beautifulsoup4>=4.11.0",
    "rich>=13.0.0",
    "netaddr>=0.8.0",
    "publicsuffixlist>=0.7.12",
    "cryptography>=41.0.0",
    "pyOpenSSL>=23.0.0",
    "lxml>=4.9.0",
    "phonenumbers>=8.13.0",
    "python-whois>=0.8.0",
    "ipwhois>=1.2.0",
    "adblockparser>=0.7",
    "pyyaml>=6.0",
    "urllib3>=1.26.0"
]

[project.scripts]
findme-who = "findmewho.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["findmewho*", "spiderfoot*", "modules*"]
